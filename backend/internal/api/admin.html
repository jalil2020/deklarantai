<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deklarant AI — Admin</title>
<style>
  :root { --bg:#f4f7fb; --card:#fff; --ink:#1e2a3a; --muted:#64748b;
    --line:#e2e8f0; --brand:#2563eb; --danger:#dc2626; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8;
      --line:#334155; --brand:#3b82f6; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  h1 { font-size: 1.3rem; margin: 0; }
  h2 { font-size: 1rem; margin: 1.8rem 0 0.7rem; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:1rem;
    padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
  .card { background: var(--card); border:1px solid var(--line); border-radius: 14px;
    padding: 1rem 1.2rem; margin-bottom: 0.8rem; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:0.8rem; }
  .stat { background: var(--card); border:1px solid var(--line); border-radius: 12px; padding: 0.9rem 1rem; }
  .stat .n { font-size: 1.5rem; font-weight: 700; }
  .stat .l { font-size: 0.8rem; color: var(--muted); }
  table { width:100%; border-collapse: collapse; font-size: 0.88rem; }
  th, td { text-align:left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; border: none; border-radius: 9px;
    padding: 0.5rem 0.9rem; background: var(--brand); color:#fff; }
  button.ghost { background: transparent; color: var(--muted); border:1px solid var(--line); }
  input { font: inherit; padding: 0.55rem 0.7rem; border:1px solid var(--line);
    border-radius: 9px; background: var(--card); color: var(--ink); width:100%; }
  .login { max-width: 340px; margin: 4rem auto; }
  .login .card { display:flex; flex-direction:column; gap:0.8rem; }
  .err { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }
  .muted { color: var(--muted); }
  .wrap-scroll { overflow-x: auto; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.85em;
    overflow-wrap: anywhere; }
  .hidden { display: none; }

  /* Tablar */
  .tabs { display:flex; gap:0.3rem; margin: 1rem 0 0.4rem; flex-wrap: wrap; }
  .tabs button { background: transparent; color: var(--muted); border:1px solid transparent;
    border-radius: 9px; padding: 0.45rem 0.8rem; }
  .tabs button[aria-selected="true"] { background: var(--card); color: var(--ink);
    border-color: var(--line); font-weight: 600; }

  /* Sozlamalar */
  .warn { background: color-mix(in srgb, var(--danger) 10%, var(--card));
    border:1px solid color-mix(in srgb, var(--danger) 35%, var(--line));
    border-radius: 12px; padding: 0.8rem 1rem; margin-bottom: 0.8rem; }
  .warn ul { margin: 0.4rem 0 0; padding-left: 1.1rem; }
  .warn li { margin: 0.25rem 0; }
  .tag { display:inline-block; font-size: 0.72rem; padding: 0.1rem 0.45rem;
    border-radius: 999px; border:1px solid var(--line); color: var(--muted);
    white-space: nowrap; }
  .tag.env { color: var(--brand); border-color: color-mix(in srgb, var(--brand) 40%, var(--line)); }
  .tag.set { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
  .tag.off { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  td.val { max-width: 320px; }
  .desc { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Login -->
  <div id="login" class="login hidden">
    <div class="card">
      <h1>Deklarant AI — Admin</h1>
      <p class="muted" style="margin:0">Panelga kirish uchun parolni kiriting.</p>
      <input id="pw" type="password" placeholder="Admin parol" autocomplete="current-password">
      <button id="loginBtn">Kirish</button>
      <div id="loginErr" class="err"></div>
    </div>
  </div>

  <!-- Panel -->
  <div id="panel" class="hidden">
    <div class="top">
      <h1>Deklarant AI — Admin</h1>
      <button id="logoutBtn" class="ghost">Chiqish</button>
    </div>

    <div class="tabs" role="tablist">
      <button data-tab="use" role="tab" aria-selected="true">Foydalanish</button>
      <button data-tab="data" role="tab" aria-selected="false">Ma'lumot</button>
      <button data-tab="cfg" role="tab" aria-selected="false">Sozlamalar</button>
    </div>

    <section id="tab-use">
      <h2>Foydalanish</h2>
      <div id="stats" class="grid"></div>

      <h2>Token sarfi (model bo'yicha)</h2>
      <div class="card wrap-scroll"><table id="tokens"></table></div>

      <h2>So'nggi so'rovlar</h2>
      <div class="card wrap-scroll"><table id="recent"></table></div>
    </section>

    <section id="tab-data" class="hidden">
      <h2>Ma'lumot bazalari</h2>
      <div id="data"></div>
    </section>

    <section id="tab-cfg" class="hidden">
      <h2>Sozlamalar</h2>
      <div id="cfgWarn"></div>
      <div id="cfg"></div>
      <p class="muted" id="cfgNote" style="font-size:0.83rem"></p>
    </section>
  </div>

</div>

<script>
const $ = (id) => document.getElementById(id)
const fmt = (n) => new Intl.NumberFormat('uz-UZ').format(n)

// esc — HTML ekranlash. Sozlama qiymatlari muhitdan keladi va ichida
// & yoki < bo'lishi mumkin (masalan URL parametri). Ular xom holda
// qo'yilsa sahifa buzilardi.
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]))

// Tablar
document.querySelectorAll('.tabs button').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach((b) => {
      const on = b === btn
      b.setAttribute('aria-selected', String(on))
      $('tab-' + b.dataset.tab).classList.toggle('hidden', !on)
    })
  }
})

async function api(path, opts) {
  const res = await fetch(path, { credentials: 'same-origin', ...opts })
  if (res.status === 401) { showLogin(); throw new Error('avtorizatsiya kerak') }
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || ('Xato ' + res.status))
  return data
}

function showLogin() { $('login').classList.remove('hidden'); $('panel').classList.add('hidden') }
function showPanel() { $('login').classList.add('hidden'); $('panel').classList.remove('hidden') }

$('loginBtn').onclick = async () => {
  $('loginErr').textContent = ''
  try {
    await api('/admin/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value }),
    })
    $('pw').value = ''
    await load()
  } catch (e) { $('loginErr').textContent = e.message }
}
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click() })

$('logoutBtn').onclick = async () => {
  try { await api('/admin/api/logout', { method: 'POST' }) } catch {}
  showLogin()
}

function renderStats(s) {
  const totalReq = Object.values(s.requests || {}).reduce((a, b) => a + b, 0)
  let out = 0, inp = 0, cache = 0
  for (const t of Object.values(s.tokens || {})) { out += t.output; inp += t.input; cache += t.cache_read }
  const hrs = Math.floor(s.uptime_seconds / 3600), mins = Math.floor((s.uptime_seconds % 3600) / 60)
  $('stats').innerHTML = [
    ['Ishga tushgan', hrs + ' soat ' + mins + ' daqiqa'],
    ['API so\'rovlar', fmt(totalReq)],
    ['Kirish tokenlari', fmt(inp)],
    ['Chiqish tokenlari', fmt(out)],
    ['Keshdan o\'qildi', fmt(cache)],
  ].map(([l, n]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('')

  // Token jadvali
  const rows = Object.entries(s.tokens || {}).map(([m, t]) =>
    `<tr><td><code>${m}</code></td><td class="num">${fmt(t.calls)}</td>
     <td class="num">${fmt(t.input)}</td><td class="num">${fmt(t.output)}</td>
     <td class="num">${fmt(t.cache_read)}</td></tr>`).join('')
  $('tokens').innerHTML = rows
    ? `<tr><th>Model</th><th class="num">Chaqiruv</th><th class="num">Kirish</th>
       <th class="num">Chiqish</th><th class="num">Keshdan</th></tr>${rows}`
    : '<tr><td class="muted">Hali sarf yo\'q</td></tr>'

  // So'nggi so'rovlar
  const rec = (s.recent || []).slice(0, 20).map(r => {
    const t = new Date(r.at).toLocaleTimeString('uz-UZ')
    return `<tr><td class="muted">${t}</td><td><code>${r.model}</code></td>
      <td class="num">${fmt(r.input)}</td><td class="num">${fmt(r.output)}</td>
      <td class="num">${fmt(r.cache_read)}</td></tr>`
  }).join('')
  $('recent').innerHTML = rec
    ? `<tr><th>Vaqt</th><th>Model</th><th class="num">Kirish</th>
       <th class="num">Chiqish</th><th class="num">Keshdan</th></tr>${rec}`
    : '<tr><td class="muted">Hali so\'rov yo\'q</td></tr>'
}

function renderData(d) {
  const cov = d.laws_link_coverage
  const pct = cov ? Math.round(cov.with_link / cov.total * 100) : 0
  const rows = [
    ['TIF TN kodlari', d.codes ? fmt(d.codes.total_codes) + ' ta' : '—',
      d.codes ? 'stavkalar ' + d.codes.rates_as_of + ' holatiga' : ''],
    ['Qonun korpusi', d.laws ? fmt(d.laws.chunks) + ' parcha, ' + d.laws.docs + ' hujjat' : '—',
      cov ? 'lex.uz havola: ' + pct + '% (' + fmt(cov.with_link) + '/' + fmt(cov.total) + ')' : ''],
    ['Hujjat talablari', d.docs ? fmt(d.docs.rules) + ' qoida, ' + d.docs.types + ' tur' : '—',
      d.exemption_programs != null ? d.exemption_programs + ' imtiyoz dasturi' : ''],
    ['Davlatlar', d.countries ? fmt(d.countries.total) + ' ta' : '—',
      d.countries ? d.countries.legal_basis : ''],
  ]
  $('data').innerHTML = rows.map(([l, v, note]) =>
    `<div class="card"><strong>${l}:</strong> ${v}${note ? ` <span class="muted">— ${note}</span>` : ''}</div>`
  ).join('')
}

function renderSettings(cfg) {
  // Ogohlantirishlar — sozlama ro'yxatining o'zi "hammasi joyidami"
  // degan savolga javob bermaydi, shuning uchun xavfli holatlar tepada.
  const w = cfg.warnings || []
  $('cfgWarn').innerHTML = w.length
    ? `<div class="warn"><strong>Diqqat (${w.length})</strong>
       <ul>${w.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`
    : ''

  $('cfg').innerHTML = (cfg.groups || []).map((g) => {
    const rows = g.items.map((s) => {
      // Maxfiy qiymat KO'RSATILMAYDI — faqat holati.
      const val = s.secret
        ? (s.set ? '<span class="tag set">sozlangan</span>'
                 : '<span class="tag off">sozlanmagan</span>')
        : `<code>${esc(s.value) || '<span class="muted">bo\'sh</span>'}</code>`
      const src = s.source === 'muhit'
        ? '<span class="tag env">muhit</span>'
        : '<span class="tag">sukut</span>'
      const restart = s.restart
        ? '<span class="tag">qayta ishga tushirish</span>'
        : '<span class="tag set">darrov</span>'
      return `<tr>
        <td><code>${esc(s.name)}</code><div class="desc">${esc(s.desc)}</div></td>
        <td class="val">${val}</td>
        <td>${src}</td>
        <td>${restart}</td>
      </tr>`
    }).join('')
    return `<h2>${esc(g.group)}</h2>
      <div class="card wrap-scroll"><table>
        <tr><th>O'zgaruvchi</th><th>Amaldagi qiymat</th><th>Manba</th><th>O'zgarishi</th></tr>
        ${rows}
      </table></div>`
  }).join('')

  $('cfgNote').textContent = cfg.note || ''
}

// refresh — tez-tez yangilanadigan qism (statistika).
async function refresh() {
  const s = await api('/admin/api/stats')
  renderStats(s)
}

// load — panelni to'liq yuklaydi. Sozlama va bazalar kamdan-kam
// o'zgaradi, shuning uchun ular faqat shu yerda o'qiladi.
async function load() {
  try {
    const [s, d, cfg] = await Promise.all([
      api('/admin/api/stats'), api('/admin/api/data'), api('/admin/api/settings'),
    ])
    renderStats(s); renderData(d); renderSettings(cfg); showPanel()
  } catch (e) {
    if (e.message !== 'avtorizatsiya kerak') $('loginErr').textContent = e.message
  }
}

// Boshlanishida sessiya bormi tekshiramiz.
load()
// Har 10 soniyada FAQAT statistika yangilanadi — sozlamalarni har safar
// qayta so'rash ortiqcha yuk bo'lardi.
setInterval(() => {
  if (!$('panel').classList.contains('hidden')) refresh().catch(() => {})
}, 10000)
</script>
</body>
</html>
