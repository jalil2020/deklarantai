# Deklarant AI — nginx sozlamasi
#
# /etc/nginx/sites-available/deklarant  →  sites-enabled/ ga bog'lanadi.
# ⚠️ Sertifikat hozircha /etc/ssl/deklarant/ da. Certbot ga o'tkazilganda
# faqat quyidagi ikki yo'l almashtiriladi:
#   /etc/letsencrypt/live/deklarantpro.uz/fullchain.pem
#   /etc/letsencrypt/live/deklarantpro.uz/privkey.pem

# HTTP — faqat yo'naltirish va ACME tekshiruvi uchun.
server {
	listen 80;
	listen [::]:80;
	server_name deklarantpro.uz www.deklarantpro.uz;

	# ⚠️ ACME yo'li YO'NALTIRISHDAN OLDIN turishi shart. Aks holda
	# Let's Encrypt tekshiruvi HTTPS ga otilib ketadi va sertifikat
	# YANGILANMAY qoladi — sayt 90 kundan keyin jimgina o'chadi.
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	# ⚠️ ESKI SINTAKSIS ATAYLAB. Alohida `http2 on;` direktivasi faqat
	# nginx 1.25.1 dan bor, Ubuntu 24.04 esa 1.24.0 ni beradi va
	# "unknown directive" bilan UMUMAN ko'tarilmaydi — sayt o'chadi.
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name deklarantpro.uz;

	ssl_certificate     /etc/ssl/deklarant/fullchain.pem;
	ssl_certificate_key /etc/ssl/deklarant/privkey.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache   shared:SSL:10m;
	ssl_session_timeout 1d;

	# ⚠️ RASM YUKLASH UCHUN MAJBURIY. nginx sukut bo'yicha 1 MB dan
	# katta tanani rad etadi (413), invoys surati esa base64 da
	# ~1,6 MB keladi. Backend chegarasi 8 MB (MAX_BODY_BYTES) —
	# ikkalasi mos bo'lishi kerak, aks holda rasm chat'ga yetib
	# bormasdan nginx darajasida to'xtardi.
	client_max_body_size 8m;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;

	add_header X-Frame-Options "DENY" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	# HSTS — HTTPS barqaror ishlayotganiga ishonch hosil qilgach yoqing.
	# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
	server_tokens off;

	# ---- API va admin paneli backend'ga
	location ~ ^/(api|admin) {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Host              $host;
		proxy_set_header X-Real-IP         $remote_addr;
		proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# ⚠️ SSE UCHUN MAJBURIY. Chat javobi oqim bilan keladi
		# (text/event-stream). Buferlash yoqiq bo'lsa javob bo'lak-bo'lak
		# emas, OXIRIDA BIRDANIGA chiqadi va foydalanuvchi 30–50 soniya
		# bo'sh ekranga qaraydi.
		proxy_buffering off;
		proxy_cache off;
		proxy_set_header Connection "";
		chunked_transfer_encoding on;

		# Javob 50 soniyagacha cho'zilishi mumkin (Opus + uzun hisob).
		proxy_read_timeout 180s;
		proxy_send_timeout 180s;
	}

	# ---- Qolgani — React ilovasi
	root /var/www/deklarant;
	index index.html;

	location / {
		# SPA: yo'l topilmasa index.html beriladi (hash-marshrut).
		try_files $uri $uri/ /index.html;
	}

	# Xeshli fayl nomlari (index-D7d.js) — uzoq keshlash xavfsiz.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
}

# www — kanonik manzilga yo'naltirish.
#
# ⚠️ ALOHIDA SERTIFIKAT bilan. Yo'naltirish ham HTTPS ustida bo'ladi,
# ya'ni brauzer avval TLS ni tugatadi — sertifikat bo'lmasa
# yo'naltirishgacha yetib bormasdan xato beradi.
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.deklarantpro.uz;

	ssl_certificate     /etc/ssl/deklarant-www/fullchain.pem;
	ssl_certificate_key /etc/ssl/deklarant-www/privkey.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;

	return 301 https://deklarantpro.uz$request_uri;
}
